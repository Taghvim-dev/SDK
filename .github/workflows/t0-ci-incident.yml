# One canonical SHA-pinned current-head CI incident observer; no repo-local duplicate logic.
# Untrusted PR source is never checked out. No Cloudflare credentials or deployment rights.
name: t0-ci-incident-reconciler
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write
concurrency:
  group: t0-ci-incident-${{ github.repository }}
  cancel-in-progress: false
jobs:
  reconcile:
    if: ${{ false }} # T0 hard-stop until explicit budget authorization and new reviewed commit
    runs-on: ubuntu-26.04
    timeout-minutes: 6
    steps:
      - name: Current source/PR incident lifecycle and immutable stale-issue retirement
        uses: Taghvim-dev/.github/.github/actions/ci-incident@b13c7fcdc14c7747b727c7ee2b66f8ef9dbf0f3b
