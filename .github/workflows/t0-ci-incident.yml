# One SHA-pinned constitutional incident observer; no repository-local implementation.
# Untrusted PR source is never checked out. No Cloudflare credentials or deployment rights.
name: t0-ci-incident-reconciler
on:
  workflow_run:
    workflows: ["public-sdk-verify"]
    types: [completed]
  schedule:
    - cron: '13 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write
concurrency:
  group: t0-ci-incident-${{ github.repository }}
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       (contains(fromJSON('["failure","timed_out","startup_failure","action_required"]'), github.event.workflow_run.conclusion) ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main')))
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Current source/PR incident lifecycle and immutable stale-issue retirement
        uses: Taghvim-dev/.github/.github/actions/ci-incident@8567e028da0e092b7728be5a5c1e7d5ac7127a3b
