# One SHA-pinned constitutional incident observer; no repository-local implementation.
# Untrusted PR source is never checked out. No Cloudflare credentials or deployment rights.
name: t0-ci-incident-reconciler
on:
  workflow_run:
    workflows: ["public-sdk-verify"]
    types: [completed]
  schedule:
    - cron: '13 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write
concurrency:
  group: t0-ci-incident-${{ github.repository }}
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["success","failure","timed_out","startup_failure","action_required"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Current source/PR incident lifecycle and immutable stale-issue retirement
        uses: Taghvim-dev/.github/.github/actions/ci-incident@0fb5a6f43e35e0094d12add4d73789e1ad0198da
