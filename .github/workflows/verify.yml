name: sdk-contract-and-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Original Apache-2.0 licensing
        run: |
          grep -q "Apache License" LICENSE
          test -f NOTICE
      - name: Contract and JavaScript client
        run: |
          node scripts/check-contract.mjs
          node --check javascript/index.js
          node --test javascript/test/*.test.mjs
      - name: Python client
        run: |
          python -m compileall -q python/taghvim_sdk
          PYTHONPATH=python python -m unittest discover -s python/tests -v
      - name: Cross-repository cookbook contract parity
        run: |
          curl -fsSL --retry 3 --max-time 20 -o /tmp/cookbook-contract.json https://raw.githubusercontent.com/Taghvim-dev/cookbooks/main/contracts/operation-index.json
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const a=JSON.parse(fs.readFileSync("contracts/operation-index.json")); const b=JSON.parse(fs.readFileSync("/tmp/cookbook-contract.json")); assert.equal(a.contractVersion,b.contractVersion);assert.equal(a.openApiGitBlobSHA,b.openApiGitBlobSHA);assert.deepEqual(a.operations,b.operations);'
