name: public-sdk-verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: License and source integrity
        run: |
          test -f LICENSE && grep -q 'Apache License' LICENSE
          test -f NOTICE
          node scripts/check-release.mjs
      - name: JavaScript SDK tests
        run: |
          node --check javascript/index.js
          node --test javascript/test/*.test.mjs
          node --test examples/javascript/client.test.mjs
          node --check examples/javascript/convert-date.mjs
      - name: Python SDK tests
        run: |
          PYTHONPATH=python python -m unittest discover -s python/tests -v
          python -m compileall -q examples/python
      - name: Verify immutable local contract and SDK surface
        run: |
          node scripts/check-release.mjs
          node scripts/check-contract.mjs
